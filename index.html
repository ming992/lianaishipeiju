function radar(r){const ds=r.analysis.dimensions,cx=210,cy=160,radius=110,point=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/10;return [cx+Math.cos(a)*radius*f,cy+Math.sin(a)*radius*f];};const polygon=f=>ds.map((_,i)=>point(i,f).join(',')).join(' ');let shapes='';for(const level of [.25,.5,.75,1])shapes+=`<polygon points="${polygon(level)}" fill="none" stroke="#eadbe5" stroke-width="1"/>`;ds.forEach((_,i)=>{const p=point(i,1);shapes+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#eee1e8"/>`;});function draw(other,color){const values=ds.map(d=>other?d.other?.skill:d.skill);if(values.every(v=>v!==null&&v!==undefined))shapes+=`<polygon points="${values.map((v,i)=>point(i,v/100).join(',')).join(' ')}" fill="${color}25" stroke="${color}" stroke-width="2"/>`;values.forEach((v,i)=>{if(v!==null&&v!==undefined){const p=point(i,v/100);shapes+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`;}});}draw(false,'#dc7d9f');if(r.mode==='duo')draw(true,'#a48cc9');ds.forEach((d,i)=>{const p=point(i,1.31);shapes+=`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" class="radar-label" data-action="dimension" data-dim="${d.id}" role="button" tabindex="0" aria-label="查看${d.name}分析">${H(d.name)}</text>`;});return `<svg class="radar" viewBox="0 0 420 325" role="group" aria-label="十维度自评相处能力雷达图，可选择维度查看分析">${shapes}</svg>`;}
function detail(r,id){const d=r.analysis.dimensions.find(d=>d.id===id)||r.analysis.dimensions[0];const duo=r.mode==='duo';return `<div class="dimension-detail"><h3>${d.icon} ${d.name} ${duo?`<span class="tag">回答相似度 ${scoreText(d.similarity)}</span>`:''}</h3><p style="margin-top:10px">${d.description}</p>${duo?`<p>自评相处能力：${H(r.names[0])} ${scoreText(d.skill)} / ${H(r.names[1])} ${scoreText(d.other.skill)}。近期满意度：${scoreText(d.satisfaction)} / ${scoreText(d.other.satisfaction)}。</p>`:`<p>自评相处能力 ${scoreText(d.skill)} · 近期满意度 ${scoreText(d.satisfaction)}。未涉及的量表以“—”表示。</p>`}${duo?d.evidence.map(e=>`<div class="evidence"><strong>${H(e.question)}</strong><br>${H(r.names[0])}：${H(e.a)}<br>${H(r.names[1])}：${H(e.b)}</div>`).join(''):d.preference?`<div class="evidence"><strong>${H(d.preference.question)}</strong><br>你的回答：${H(d.preference.answer)}</div>`:'<div class="evidence">本次在此维度没有偏好类问题。</div>'}<p><strong>一起练习：</strong>${d.practice}</p><p><strong>值得聊聊：</strong>${d.discussion}</p></div>`;}
function profileCard(p,name){return `<article class="card profile-card"><span class="tag">${H(name)} · ${p.partial?'初步探索':'问卷表达倾向'}</span><p><strong>${H(p.name)}</strong></p><p>${H(p.description)}</p>${p.evidence.map(e=>`<div class="evidence">${H(e.question)}<br><strong>${H(e.answer)}</strong></div>`).join('')}<small class="muted">仅反映问卷回答，不作为正式心理诊断。</small></article>`;}
function report(){const r=state.report;if(!r)return history();const a=r.analysis,duo=r.mode==='duo';const traits=duo?r.matches:a.dimensions.filter(d=>d.preference).slice(0,3).map(d=>({dimension:d.name,question:d.preference.question,a:d.preference.answer}));const differences=duo?r.differences:a.dimensions.filter(d=>d.preference).slice(0,3);const stageAdvice={刚认识:'先讨论联系与见面的节奏，不急于确定所有长期答案。',暧昧中:'邀请彼此明确目前愿意投入的时间与关系期待。',热恋期:'保留各自生活安排，也一起建立舒服的小习惯。',稳定交往:'定期检查旧约定是否还适合现在的两个人。',异地恋:'共同安排可实现的联系时段与下一次见面计划。',长期伴侣:'重新分享当下目标，允许熟悉的彼此继续改变。'}[r.stage];return `<div class="report-head"><div><span class="eyebrow">YOUR LOVE LETTER</span><h1>${duo?'你们的爱情探索报告':'你的恋爱探索报告'} ♡</h1></div><div class="report-actions"><button class="btn primary" data-action="share">制作分享卡 ♡</button><button class="btn outline" data-action="print">保存 PDF</button><button class="btn outline" data-action="history">历史记录</button></div></div><div class="print-only">私密完整报告，请谨慎保存与分享。原创娱乐性探索，不预测关系结局。</div><section class="card report-hero"><div class="report-main"><div class="score-circle" style="--score:${duo?a.index??0:100}"><div><strong ${duo?'data-count="'+a.index+'"':''}>${duo?scoreText(a.index):'♡'}</strong><span>${duo?'恋爱适配参考指数':'懂自己，也是一种心动'}</span></div></div><div><span class="tag">${H(r.names[0])}${duo?' × '+H(r.names[1]):''}</span><h2>${H(r.title)}</h2><p>${H(r.summary)}</p><div class="report-meta">${dateText(r.created)} · ${H(r.stage)} · ${data.versions[r.version].name}</div></div></div>${Mascots.scene(duo&&a.index<70?'thinking':'happy')}</section><div class="stats-grid"><article class="card stat"><span>${duo?'情感需求相似度':'偏好探索覆盖'}</span><strong>${duo?scoreText(a.needs):a.qualityA.coverage+'/10'}</strong><small>${duo?'偏好与价值取向的回答比较':'有回答证据的核心维度'}</small></article><article class="card stat"><span>${duo?'重要价值观相似度':'表达画像依据'}</span><strong>${duo?scoreText(a.values):a.profileA.evidence.length+' 项'}</strong><small>${duo?'仅反映此次回答的相似程度':'来自真实偏好类回答'}</small></article><article class="card stat"><span>自评相处能力</span><strong>${scoreText(a.skillA)}${duo?' / '+scoreText(a.skillB):''}</strong><small>${duo?'双方分别自评，不是关系评分':'所答能力量表的平均倾向'}</small></article><article class="card stat"><span>近期关系满意度</span><strong>${scoreText(a.satisfactionA)}${duo?' / '+scoreText(a.satisfactionB):''}</strong><small>当前主观感受，与相似程度不同</small></article></div><div class="report-grid"><section class="card"><h3>十维度爱情雷达图</h3><p class="credit-note">展示自评相处能力。点击维度名字查看回答与解释。速测缺失数据只显示已有点，不连接成完整图形。</p>${radar(r)}<div class="legend"><span><i></i>${H(r.names[0])}</span>${duo?`<span><i></i>${H(r.names[1])}</span>`:''}</div></section><section class="card"><h3>答案背后的需要</h3><label><span class="credit-note">选择一个维度</span><select class="dimension-select" id="dimension-select">${a.dimensions.map(d=>`<option value="${d.id}" ${state.dimension===d.id?'selected':''}>${d.icon} ${d.name}${duo?' · 相似度 '+scoreText(d.similarity):''}</option>`).join('')}</select></label><div id="dimension-detail">${detail(r,state.dimension)}</div></section></div><section class="report-section"><h2>${duo?'你们的心动契合点':'我的三个恋爱需求线索'} ♡</h2><div class="parallel-grid">${traits.length?traits.map((m,i)=>`<article class="card match-card"><span class="eyebrow">0${i+1} / ${H(m.dimension)}</span><h3>${H(m.a)}</h3><p>回答依据：${H(m.question)}</p><p>${duo?'你们都选择了这一回答。相似是一个线索，实际相处仍值得继续交流。':'这是你在问卷里的选择，可以用来向对方说明自己的需求。'}</p></article>`).join(''):'<div class="card"><p>这次回答没有完全相同的选项。不同的需要同样可以成为了解彼此的起点。</p></div>'}</div>${duo&&traits.length<3?`<p class="credit-note">仅找到 ${traits.length} 项完全相同的回答；不会补造不存在的默契。</p>`:''}</section><section class="report-section"><h2>${duo?'甜蜜磨合区':'值得试试的温柔练习'} 🍰</h2>${differences.length?differences.map(d=>{const e=duo?d.evidence.find(e=>e.similarity<80):null;return `<article class="card difference"><h3>${d.icon} ${d.name}${duo?' · 相似度 '+d.similarity:''}</h3>${e?`<div class="two-col"><div class="speech"><strong>${H(r.names[0])} 的回答倾向</strong><p>${H(e.a)}</p></div><div class="speech purple"><strong>${H(r.names[1])} 的回答倾向</strong><p>${H(e.b)}</p></div></div><div class="evidence">依据：${H(e.question)}</div>`:d.preference?`<div class="evidence">你选择了「${H(d.preference.answer)}」</div>`:''}<p class="muted" style="font-size:12px;margin:12px 0">${duo?'不同的选择可能让双方以自己的方式理解同一情境。这里提示需要交流的主题，不代表已经发生冲突。':'把自己喜欢的方式说明白，也为对方的不同留一点空间。'}</p><p style="font-size:12px"><strong>可以怎么聊：</strong>${d.practice} ${d.discussion}</p></article>`;}).join(''):'<div class="card"><p>这次没有筛出明显差异维度。相似的回答也需要在现实中持续沟通。</p></div>'}</section><section class="report-section"><h2>爱情沟通翻译机 💬</h2><div class="two-col">${(duo?[r.names[0],r.names[1]]:[r.names[0]]).map((name,i)=>{const d=differences[0]||a.dimensions[0];return `<div class="speech ${i?'purple':''}"><strong>${H(name)} 可以这样开口</strong><p style="margin:10px 0">“${LoveReports.expression(r.answers[i],d.id)}”</p><small>围绕 ${d.name} · ${d.discussion}</small></div>`;}).join('')}</div></section><section class="report-section"><h2>${duo?'我们的恋爱表达画像':'我的恋爱表达画像'} 🐰</h2><div class="two-col">${profileCard(a.profileA,r.names[0])}${duo?profileCard(a.profileB,r.names[1]):''}</div></section><section class="report-section"><h2>7 天恋爱微行动计划 ✨</h2><p class="muted" style="font-size:12px;margin-bottom:15px">${stageAdvice} 每一项可自愿调整，不需要连续打卡。</p><div class="plan-grid">${r.plan.map(p=>`<article class="card plan-card"><span class="day">DAY 0${p.day} · ${p.dimension}</span><p>${p.task}</p><small>${p.reason}</small></article>`).join('')}</div><button class="text-button" data-action="plan-calendar">将计划加入本地日历 →</button></section><section class="card report-section quality"><h3>数据完整度与解读边界</h3><p style="margin:13px 0">${H(r.names[0])}：${LoveReports.qualityText(a.qualityA)}</p>${duo?`<p>${H(r.names[1])}：${LoveReports.qualityText(a.qualityB)}</p>`:''}<p style="margin-top:12px">${duo?'总体参考指数是双方有效回答相似度的加权平均。分类题相同记 100、不同记 45；量表先反向转换，再用 100 − 双方分值差计算相似度。价值取向题权重 1.25，其余为 1。分值与分层均为产品内部的娱乐规则，没有正式信效度验证。':'单人无法计算双人适配指数。能力与满意度分开计算，反向量表先转换为 100 − 原分值，缺失答案不纳入平均。'} 这里不预测关系成功率，也不替你决定分手、结婚或继续交往。</p><button class="text-button" data-action="algorithm">查看透明计分说明 →</button></section><div class="bottom-actions"><button class="btn primary" data-action="share">把小小心动做成分享卡 ♡</button><button class="btn outline" data-action="invite">复制纯邀请链接</button><button class="btn outline" data-action="lab">去心动实验室 →</button></div>`;}
function animateScore(){const el=$('[data-count]');if(!el)return;const value=Number(el.dataset.count);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const start=performance.now();const tick=now=>{if(!el.isConnected)return;const p=Math.min(1,(now-start)/650);el.textContent=Math.round(value*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick);};requestAnimationFrame(tick);}

['gacha','🎀','爱情真心话扭蛋机','温柔、搞怪或深度交流。每一题都是邀请，随时换题，不必分享隐私。','150 个话题'],
['calendar','🌙','情侣默契日历','自愿选择今天的小任务。没有连续打卡压力，慢慢来就好。','每日微行动']
].map(([key,icon,title,desc,tag])=>`<article class="card lab-card"><span class="tag">${tag}</span><div class="lab-icon">${icon}</div><h3>${title}</h3><p>${desc}</p><button class="btn ${key==='know'?'primary':'outline'} full" data-action="open-game" data-game="${key}">开始心动实验 →</button></article>`).join('')}</div><div class="soft-banner">♡ 小游戏的猜中率只表示本次选择；不代表爱意程度或关系适配结论。</div>`;}
function openGame(kind){if(kind==='wishes'||kind==='calendar'){navigate(kind);return;}state.game={kind,index:0,choices:[],phase:'a',handover:false,total:0,hits:0,mode:'gentle',truth:null};navigate('game');}
function game(){const g=state.game;if(!g)return lab();if(g.kind==='gacha')return `<div class="narrow"><div class="page-topline"><button class="back" data-action="lab">← 返回心动实验室</button><span class="step-badge">150 个原创话题 · 随时换题</span></div><section class="card game-card" style="margin-top:25px"><span class="tag">爱情真心话扭蛋机</span><div class="gacha-orb">♡</div><div class="tabs" style="justify-content:center">${[['gentle','温柔模式'],['playful','搞怪模式'],['deep','深度交流']].map(([key,label])=>`<button data-action="gacha-mode" data-mode="${key}" class="${g.mode===key?'active':''}">${label}</button>`).join('')}</div><div class="game-question">${g.truth?H(g.truth.text):'扭开一颗，藏着一点点更懂你的心意。'}</div><button class="btn primary" data-action="draw-truth">${g.truth?'再换一个温柔话题':'扭一颗心动扭蛋'} ✧</button><p class="credit-note">你们都愿意再聊；不想回答，换一题也很好。</p></section></div>`;
const q=LoveGames.pairs[g.index%LoveGames.pairs.length],know=g.kind==='know';const phaseLabels={a:'第一位：选自己的答案',b:'第二位：选自己的答案',guessA:'第一位：猜第二位的答案',guessB:'第二位：猜第一位的答案'};
if(g.handover)return `<div class="narrow"><div class="card handover">${Mascots.scene()}<h1>把设备交给${g.phase==='b'||g.phase==='guessB'?'第二位':'第一位'} ♡</h1><p>已隐藏上一位的选择。${phaseLabels[g.phase]}，请独立作答。</p><button class="btn purple" data-action="game-continue">我准备好了 →</button><div><button class="text-button" data-action="lab">结束本次互动</button></div></div></div>`;
if(g.phase==='reveal'){const same=g.choices[0]===g.choices[1],hitA=g.choices[2]===g.choices[1],hitB=g.choices[3]===g.choices[0];return `<div class="narrow"><div class="page-topline"><button class="back" data-action="lab">← 返回实验室</button><span class="step-badge">已玩 ${g.total} 轮</span></div><section class="card game-card" style="margin-top:25px"><span class="tag">${know?'你真的懂 TA 吗？':'恋爱默契二选一'} · 揭晓</span><h1>${H(q.topic)}</h1><div class="game-reveal"><p>第一位：<strong>${H(q.options[g.choices[0]])}</strong></p><p>第二位：<strong>${H(q.options[g.choices[1]])}</strong></p>${know?`<p>第一位的猜测：${hitA?'猜中啦 ♡':'这次有新发现'} · 第二位的猜测：${hitB?'猜中啦 ♡':'这次有新发现'}</p>`:`<p>${same?'这次选择同频啦 ♡':'不同的选择，多一个了解对方的机会。'}</p>`}</div><h3>本次${know?'猜中率':'同选率'} ${Math.round(g.hits/(g.total*(know?2:1))*100)}%</h3><p class="credit-note">${know?'猜中次数 / 双方猜测总数':'相同选择轮数 / 已完成轮数'}。没有高低好坏，聊聊选择背后的理由吧。</p><div class="bottom-actions" style="justify-content:center"><button class="btn primary" data-action="next-game">下一轮 →</button><button class="btn outline" data-action="lab">结束互动</button></div></section></div>`;}
return `<div class="narrow"><div class="page-topline"><button class="back" data-action="lab">← 返回实验室</button><span class="step-badge">${g.index%60+1} / 60 个情境</span></div><section class="card game-card" style="margin-top:25px"><span class="tag">${know?'你真的懂 TA 吗？':'恋爱默契二选一'}</span><h1>${phaseLabels[g.phase]}</h1><div class="game-question">${H(q.topic)}，${g.phase.startsWith('guess')?'TA 会选哪一种？':'你更想选哪一种？'}</div><div class="game-options">${q.options.map((o,i)=>`<button data-action="game-pick" data-value="${i}">${H(o)}</button>`).join('')}</div><p class="credit-note">选择后收好答案，再让另一位独立选择。</p></section></div>`;}
function gamePick(value){const g=state.game;if(!g||g.handover||g.phase==='reveal')return;const mapping={a:0,b:1,guessA:2,guessB:3};g.choices[mapping[g.phase]]=value;if(g.phase==='a'){g.phase='b';g.handover=true;}else if(g.phase==='b'&&g.kind==='know'){g.phase='guessA';g.handover=true;}else if(g.phase==='guessA'){g.phase='guessB';g.handover=true;}else {g.phase='reveal';g.total++;g.hits+=g.kind==='know'?Number(g.choices[2]===g.choices[1])+Number(g.choices[3]===g.choices[0]):Number(g.choices[0]===g.choices[1]);const saved=LoveStore.get();saved.gameRuns=[{kind:g.kind,date:new Date().toISOString(),question:g.index%60,hits:g.hits,total:g.total},...saved.gameRuns].slice(0,100);LoveStore.put(saved);}render();}
function wishes(){const saved=LoveStore.get().wishes;const items=LoveGames.wishes.filter(w=>(state.wishFilter==='all'||state.wishFilter==='fav'&&saved[w.id]?.favorite||state.wishFilter==='done'&&saved[w.id]?.done)&&w.title.includes(state.wishSearch));return `<div class="page-topline"><button class="back" data-action="lab">← 返回实验室</button><span class="step-badge">100 个小目标 · 完全自愿</span></div><div class="page-head"><div class="eyebrow">OUR LITTLE WISHES</div><h1>我们的恋爱愿望清单 🌷</h1><p>愿望不用一次完成，每一个小小日常都值得记录。</p></div><div class="wish-controls"><div class="tabs">${[['all','全部愿望'],['fav','已收藏'],['done','已完成']].map(([key,label])=>`<button data-action="wish-filter" data-filter="${key}" class="${state.wishFilter===key?'active':''}">${label}</button>`).join('')}</div><label><span class="skip-link">搜索愿望</span><input class="search" id="wish-search" placeholder="搜索一个想一起做的小事…" value="${H(state.wishSearch)}"></label></div><div class="wish-grid" id="wish-grid">${wishCards(items,saved)}</div>${!items.length?'<p class="muted" style="text-align:center;padding:35px">暂时没有符合条件的愿望。</p>':''}`;}
function wishCards(items,saved){return items.map(w=>{const s=saved[w.id]||{};return `<article class="card wish-card ${s.done?'done':''}"><button class="favorite ${s.favorite?'active':''}" data-action="favorite" data-id="${w.id}" aria-label="${s.favorite?'取消收藏':'收藏'}${H(w.title)}" aria-pressed="${!!s.favorite}">${s.favorite?'♥':'♡'}</button><h3>${H(w.title)}</h3><p>${w.category}${s.done?' · 完成于 '+H(s.date||'未记录日期'):''}</p>${s.photo?`<img class="wish-photo" src="${s.photo}" alt="本地愿望照片">`:''}${s.note?`<p>${H(s.note)}</p>`:''}<button class="btn outline" data-action="wish-edit" data-id="${w.id}">${s.done?'编辑这段回忆':'记录 / 标记完成'} →</button></article>`;}).join('');}
function wishEdit(id){const w=LoveGames.wishes.find(w=>w.id===id),s=LoveStore.get().wishes[id]||{};if(!w)return;openModal('收好这一个小瞬间',`<span class="tag">${H(w.title)}</span><form id="wish-form" data-id="${id}"><label class="check"><input type="checkbox" name="done" ${s.done?'checked':''}>我们已完成这个小愿望</label><label class="field"><span>记录日期</span><input type="date" name="date" value="${H(s.date||today())}" required></label><label class="field"><span>想留的一句话</span><textarea name="note" maxlength="180" placeholder="只记下你们愿意保存的内容…">${H(s.note||'')}</textarea></label><label class="field"><span>照片（选填 · 仅保存在本地）</span><input type="file" class="file-input" name="photo" accept="image/jpeg,image/png,image/webp"></label>${s.photo?'<label class="check"><input type="checkbox" name="removePhoto">移除已保存的照片</label>':''}<p class="credit-note">照片将缩小保存。请使用双方愿意记录的照片。</p><button class="btn primary full" type="submit">保存这段回忆 ♡</button></form>`,true);}
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
async function processPhoto(file){if(!file.size)return null;if(file.size>10*1024*1024)throw new Error('请选小于 10MB 的 JPG、PNG 或 WebP 图片');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('请选择 JPG、PNG 或 WebP 图片');const bitmap=await createImageBitmap(file),canvas=document.createElement('canvas'),ratio=Math.min(1,700/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*ratio);canvas.height=Math.round(bitmap.height*ratio);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/jpeg',.72);}
async function saveWish(form){const fd=new FormData(form),id=form.dataset.id,s=LoveStore.get(),old=s.wishes[id]||{},file=fd.get('photo');try{let photo=fd.has('removePhoto')?null:old.photo;if(file?.size)photo=await processPhoto(file);s.wishes[id]={favorite:!!old.favorite,done:fd.has('done'),date:String(fd.get('date')),note:String(fd.get('note')).slice(0,180),photo};const ok=LoveStore.put(s);modal.close();render();toast(ok?'小小回忆已保存在本设备 ♡':'存储空间不足，回忆仅在当前页面保留。请下载照片备份。');}catch(err){toast(err.message||'照片无法读取，请换一张图片。');}}
function calendar(){const [year,month]=state.calendarMonth.split('-').map(Number),first=new Date(year,month-1,1),count=new Date(year,month,0).getDate(),saved=LoveStore.get().calendar;let cells=Array.from({length:first.getDay()},()=>'<div></div>').join('');for(let d=1;d<=count;d++){const date=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`,s=saved[date];cells+=`<button class="calendar-day ${date===today()?'today':''} ${s?.done?'complete':''}" data-action="calendar-day" data-date="${date}" aria-label="${date}${s?.done?'，已记录':''}"><strong>${d} ${s?.done?'♡':''}</strong><small>${s?'已安排小任务':date===today()?'今天的小心动':'自由的一天'}</small></button>`;}return `<div class="page-topline"><button class="back" data-action="lab">← 返回实验室</button><span class="step-badge">不用连续打卡，也很好</span></div><div class="page-head"><div class="eyebrow">MAKE ROOM FOR LITTLE JOYS</div><h1>情侣默契日历 🌙</h1><p>选择你们都愿意参与的任务，完成与否都不会影响任何测评分数。</p></div><div class="card"><div class="calendar-nav"><button class="btn outline" data-action="calendar-month" data-delta="-1" aria-label="上个月">←</button><h2>${year} 年 ${month} 月</h2><button class="btn outline" data-action="calendar-month" data-delta="1" aria-label="下个月">→</button></div><div class="calendar-grid">${['日','一','二','三','四','五','六'].map(w=>'<div class="weekday">'+w+'</div>').join('')}${cells}</div></div>`;}
function calendarDay(date){const s=LoveStore.get().calendar[date]||{};openModal('给这一天，留一点心动',`<span class="tag">${date}</span><form id="calendar-form" data-date="${date}"><label class="field" style="margin-top:20px"><span>自愿安排的小任务</span><textarea name="task" maxlength="120" required>${H(s.task||LoveGames.calendarTask(date))}</textarea></label><label class="check"><input type="checkbox" name="done" ${s.done?'checked':''}>我们愿意记为已完成</label><label class="field"><span>今天的一句话</span><input name="note" maxlength="100" value="${H(s.note||'')}" placeholder="记录感受，不给自己压力"></label><button type="submit" class="btn primary full">保存到本地日历 ♡</button>${s.task?`<button type="button" class="text-button" data-action="remove-day" data-date="${date}">移除这一天的任务</button>`:''}</form>`,true);}
function planCalendar(){const saved=LoveStore.get(),base=new Date(today()+'T12:00:00');let added=0;state.report.plan.forEach((p,i)=>{const dt=new Date(base);dt.setDate(base.getDate()+i);const key=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;if(!saved.calendar[key]){saved.calendar[key]={task:p.task,done:false,note:''};added++;}});LoveStore.put(saved);toast(`已加入 ${added} 个微行动，已有任务的日期会保留。`);}
function render(){document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===state.view||el.dataset.nav==='lab'&&['game','wishes','calendar'].includes(state.view)||el.dataset.nav==='home'&&['setup','quiz','handover','report'].includes(state.view)));const views={home,setup,quiz,handover,report,history,lab,game,wishes,calendar};main.innerHTML=(views[state.view]||home)();if(state.view==='report')animateScore();}
async function action(el){const key=el.dataset.action;if(el.disabled)return;switch(key){
case 'home':case 'lab':case 'history':navigate(key);break;
case 'setup':state.setupMode=el.dataset.mode||'solo';state.version=state.setupMode==='duo'?'duo':'quick';navigate('setup');break;
case 'version':state.version=el.dataset.version;document.querySelectorAll('.version-choice').forEach(b=>{const selected=b.dataset.version===state.version;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',selected);});break;
case 'resume':draft=LoveStore.get().draft;if(draft)navigate(draft.handover?'handover':'quiz');else toast('没有可以恢复的进度');break;
case 'answer':if(!draft)return;draft.answers[draft.person][draft.ids[draft.index]]=el.dataset.value;persist();render();$('.option.selected')?.focus({preventScroll:true});break;
case 'previous':if(draft.index>0){draft.index--;persist();render();$('#question-title')?.scrollIntoView({block:'nearest'});}break;
case 'next':if(!draft||draft.answers[draft.person][draft.ids[draft.index]]===undefined)return;if(draft.index<draft.ids.length-1){draft.index++;persist();render();$('#question-title')?.scrollIntoView({block:'nearest'});}else await finish();break;
case 'begin-partner':if(!draft)return;draft.person=1;draft.index=0;draft.handover=false;persist();navigate('quiz');break;
case 'privacy':privacy();break;
case 'pricing':pricing();break;
case 'sample':sample();break;
case 'close-modal':modal.close();break;
case 'confirm-clear':openModal('删除本设备全部数据？','<p>这将删除未完成测评、历史报告、照片、愿望与日历记录，无法恢复。</p><div class="bottom-actions"><button class="btn danger outline" data-action="clear-all">确认删除全部数据</button><button class="btn outline" data-action="close-modal">保留记录</button></div>',true);break;
case 'clear-all':LoveStore.clear();draft=null;state.report=null;state.share=null;state.game=null;navigate('home');toast('本设备记录已全部删除');break;
case 'open-report':state.report=LoveStore.get().history.find(r=>r.id===el.dataset.id);state.dimension='communication';navigate('report');break;
case 'remove-report':openModal('删除这份报告？',`<p>只删除这份报告，其他本地记录会保留。</p><button class="btn outline danger" data-action="remove-report-confirm" data-id="${el.dataset.id}">确认删除</button>`,true);break;
case 'remove-report-confirm':LoveStore.removeReport(el.dataset.id);if(state.report?.id===el.dataset.id)state.report=null;modal.close();render();toast('报告已删除');break;
case 'compare':compare();break;
case 'dimension':state.dimension=el.dataset.dim;$('#dimension-select').value=state.dimension;$('#dimension-detail').innerHTML=detail(state.report,state.dimension);$('#dimension-detail').scrollIntoView({block:'nearest',behavior:'smooth'});break;
case 'share':shareModal();break;
case 'download-card':try{await LoveShare.download($('#share-canvas'),state.share.type);toast('PNG 已生成，请查看浏览器下载');}catch{toast('图片导出失败，请降低清晰度后重试。');}break;
case 'native-share':try{const ok=await LoveShare.native($('#share-canvas'),state.share.type,LoveShare.caption(state.report));if(!ok){await LoveShare.download($('#share-canvas'),state.share.type);toast('此浏览器不支持系统图片分享，已下载 PNG。');}}catch(err){if(err.name!=='AbortError')toast('系统分享不可用，请使用下载 PNG。');}break;
case 'copy-caption':await copyText(LoveShare.caption(state.report));break;
case 'invite':invite();break;
case 'print':window.print();break;
case 'algorithm':openModal('透明计分 · 固定答案得到固定结果','<div class="long-copy"><p>5 级量表映射到 0、25、50、75、100；反向题用 100 − 原分。相处能力与满意度分别平均，不把偏好当作能力。</p><p>双人分类题相同记 100、不同记 45；不同的类别没有好坏排名。量表相似度为 100 − 两人有效分值的绝对差。价值取向题权重 1.25，其余题为 1，总体参考指数为双方共同完成题目的加权平均。</p><p>需求相似度使用偏好及价值题，价值观相似度仅使用价值题。这表示回答相似程度，不是已验证的长期兼容性。分层为内部娱乐表达，画像取自四道偏好题的组合，不是心理诊断。</p><p>缺失回答不纳入计算，无共同答案显示“—”。中立回答比例、完成题数与反向相关题的方向差异会单独提示。全部规则均可在源码和 README 中查看。</p></div>',true);break;
case 'open-game':openGame(el.dataset.game);break;
case 'game-continue':state.game.handover=false;render();break;
case 'game-pick':gamePick(Number(el.dataset.value));break;
case 'next-game':state.game.index++;state.game.choices=[];state.game.phase='a';state.game.handover=false;render();break;
case 'gacha-mode':state.game.mode=el.dataset.mode;state.game.truth=null;render();break;
case 'draw-truth':state.game.truth=LoveGames.draw(state.game.mode,state.game.truth?.index);render();break;
case 'wish-filter':state.wishFilter=el.dataset.filter;render();break;
case 'favorite':{const saved=LoveStore.get(),id=el.dataset.id;saved.wishes[id]={...saved.wishes[id],favorite:!saved.wishes[id]?.favorite};LoveStore.put(saved);render();break;}
case 'wish-edit':wishEdit(el.dataset.id);break;
case 'calendar-month':{const [y,m]=state.calendarMonth.split('-').map(Number),dt=new Date(y,m-1+Number(el.dataset.delta),1);state.calendarMonth=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');render();break;}
case 'calendar-day':calendarDay(el.dataset.date);break;
case 'remove-day':{const s=LoveStore.get();delete s.calendar[el.dataset.date];LoveStore.put(s);modal.close();render();toast('已移除这一天的任务');break;}
case 'plan-calendar':planCalendar();break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el).catch(err=>{console.error(err);toast('操作暂时没有完成，请重试。');});});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-action]')){e.preventDefault();action(e.target);}if(state.view==='quiz'&&!modal.open&&/^[1-5]$/.test(e.key)&&!e.target.matches('input,textarea,select')){const b=document.querySelectorAll('.option')[Number(e.key)-1];b?.click();}});
document.addEventListener('submit',e=>{if(e.target.id==='setup-form'){e.preventDefault();start(e.target);}else if(e.target.id==='wish-form'){e.preventDefault();saveWish(e.target);}else if(e.target.id==='calendar-form'){e.preventDefault();const form=e.target,fd=new FormData(form),s=LoveStore.get();s.calendar[form.dataset.date]={task:String(fd.get('task')).trim(),note:String(fd.get('note')).trim(),done:fd.has('done')};LoveStore.put(s);modal.close();render();toast('今天的小任务已保存 ♡');}});
document.addEventListener('change',e=>{if(e.target.id==='dimension-select'){state.dimension=e.target.value;$('#dimension-detail').innerHTML=detail(state.report,state.dimension);}if(e.target.closest('#share-form'))updateShare();});
document.addEventListener('input',e=>{if(e.target.closest('#share-form'))updateShare();if(e.target.id==='wish-search'){state.wishSearch=e.target.value;const saved=LoveStore.get().wishes,items=LoveGames.wishes.filter(w=>(state.wishFilter==='all'||state.wishFilter==='fav'&&saved[w.id]?.favorite||state.wishFilter==='done'&&saved[w.id]?.done)&&w.title.includes(state.wishSearch));$('#wish-grid').innerHTML=wishCards(items,saved)||'<p class="muted">暂时没有符合条件的愿望。</p>';}});
modal.addEventListener('click',e=>{if(e.target===modal){const rect=modal.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)modal.close();}});
state.calendarMonth=today().slice(0,7);render();
if(!LoveStore.available())toast('当前浏览器不支持本地保存；请保持页面开启并下载需要的报告。');
})();




</script>
</body></html>
